<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boxes</title>
    <style>
        #container {
            border: 3px solid black;
            background-color: beige;
            display: flex;
        }
        .box {
            width: 130px;
            height: 130px;
            border: 2px solid black;
            flex-direction: row;
        }
        #box1 { background-color: aqua; }
        #box2 { background-color: blue; }
        #box3 { background-color: orange; }
        #box4 { background-color: brown; }

        #shadow{
            border: 2px solid brown;
            box-shadow: 15px 15px 5px 5px black;
            margin: 5px;
            padding: 5px;
        }
    </style>
</head>
<body>

    <div id="container">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
    </div>

    <div id="shadow">
        hello world 
    </div>

</body>
</html>
